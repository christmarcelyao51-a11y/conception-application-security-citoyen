services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: security_citoyen
      POSTGRES_USER: security_citoyen
      POSTGRES_PASSWORD: security_citoyen_dev
    ports:
      - "5432:5432"
    volumes:
      - security_citoyen_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U security_citoyen -d security_citoyen"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: postgres
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  security_citoyen_pgdata:
